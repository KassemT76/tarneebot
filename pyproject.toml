[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tarneebot"
version = "0.1.0"
description = "Tarneeb simulator and baseline search agents for COMP 3106"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tarneebot = "tarneebot.cli:main"

[project.gui-scripts]
tarneebot-gui = "tarneebot.gui:main"

[tool.setuptools.packages.find]
include = ["tarneebot*"]
